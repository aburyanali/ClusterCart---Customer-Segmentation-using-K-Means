<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>3D Customer Clusters</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  overflow:hidden;
  background:#0b1120;
  font-family:Arial,sans-serif;
  color:white;
}

canvas{
  display:block;
  width:100vw;
  height:100vh;
}

.title{
  position:absolute;
  top:24px;
  left:30px;
  z-index:10;
}

.title h1{
  font-size:32px;
  margin-bottom:8px;
  font-weight:700;
}

.title p{
  color:#94a3b8;
  font-size:15px;
}

.legend{
  position:absolute;
  bottom:24px;
  left:30px;
  display:flex;
  gap:18px;
  z-index:10;
  color:#cbd5e1;
  font-size:14px;
}

.legend div{
  display:flex;
  align-items:center;
  gap:8px;
}

.dot{
  width:12px;
  height:12px;
  border-radius:50%;
}

</style>
</head>

<body>

<div class="title">
  <h1>3D Customer Clusters by RFM</h1>
  <p>AI-powered customer segmentation visualization</p>
</div>

<div class="legend">
  <div><span class="dot" style="background:#3b82f6"></span>Cluster 0</div>
  <div><span class="dot" style="background:#22c55e"></span>Cluster 1</div>
  <div><span class="dot" style="background:#f59e0b"></span>Cluster 2</div>
  <div><span class="dot" style="background:#ef4444"></span>Cluster 3</div>
</div>

<canvas id="canvas"></canvas>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

function resize(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}

resize();

window.addEventListener("resize", resize);

const W = () => canvas.width;
const H = () => canvas.height;

const centerX = () => W() * 0.42;
const centerY = () => H() * 0.65;

function rand(min,max){
  return Math.random() * (max - min) + min;
}

function project(x,y,z){

  return {
    x: centerX() + (x - y * 0.9),
    y: centerY() + (y * 0.45 - z * 0.75)
  };
}

function createCluster(count, xr, yr, zr, color){

  const arr = [];

  for(let i=0;i<count;i++){

    arr.push({

      x: rand(xr[0], xr[1]),
      y: rand(yr[0], yr[1]),
      z: rand(zr[0], zr[1]),

      color,

      radius: rand(2,4),

      phase: rand(0, Math.PI * 2),

      speed: rand(0.5,1.4),

      amp: rand(0.8,2.8)

    });

  }

  return arr;
}

const points = [

  ...createCluster(
    500,
    [0,110],
    [0,60],
    [50,140],
    "#3b82f6"
  ),

  ...createCluster(
    500,
    [0,110],
    [0,60],
    [0,50],
    "#22c55e"
  ),

  ...createCluster(
    400,
    [70,190],
    [10,65],
    [0,75],
    "#f59e0b"
  ),

  ...createCluster(
    400,
    [110,330],
    [15,80],
    [0,95],
    "#ef4444"
  )

];

function drawGrid(){

  ctx.strokeStyle = "rgba(148,163,184,0.12)";
  ctx.lineWidth = 1;

  for(let i=0;i<=7;i++){

    const gy = i * 20;

    const a = project(0, gy, 0);
    const b = project(360, gy, 0);

    ctx.beginPath();
    ctx.moveTo(a.x,a.y);
    ctx.lineTo(b.x,b.y);
    ctx.stroke();
  }

}

function drawAxes(){

  ctx.strokeStyle = "rgba(255,255,255,0.5)";
  ctx.lineWidth = 1.5;

  const origin = project(0,0,0);

  const xAxis = project(370,0,0);
  const yAxis = project(0,130,0);
  const zAxis = project(0,0,170);

  ctx.beginPath();

  ctx.moveTo(origin.x,origin.y);
  ctx.lineTo(xAxis.x,xAxis.y);

  ctx.moveTo(origin.x,origin.y);
  ctx.lineTo(yAxis.x,yAxis.y);

  ctx.moveTo(origin.x,origin.y);
  ctx.lineTo(zAxis.x,zAxis.y);

  ctx.stroke();

  ctx.fillStyle = "#cbd5e1";
  ctx.font = "16px Arial";

  ctx.fillText("Monetary", xAxis.x - 30, xAxis.y + 30);

  ctx.save();
  ctx.translate(yAxis.x + 30, yAxis.y);
  ctx.rotate(-0.65);
  ctx.fillText("Frequency",0,0);
  ctx.restore();

  ctx.save();
  ctx.translate(zAxis.x + 20, zAxis.y);
  ctx.rotate(-1.57);
  ctx.fillText("Recency",0,0);
  ctx.restore();
}

function animate(time){

  ctx.clearRect(0,0,W(),H());

  drawGrid();
  drawAxes();

  const rendered = points.map(p=>{

    const dx =
      Math.sin(time * 0.001 * p.speed + p.phase) * p.amp;

    const dy =
      Math.cos(time * 0.0011 * p.speed + p.phase) * p.amp;

    const dz =
      Math.sin(time * 0.0009 * p.speed + p.phase) * p.amp;

    const pos = project(
      p.x + dx,
      p.y + dy,
      p.z + dz
    );

    return {

      ...p,

      sx: pos.x,
      sy: pos.y,

      depth: p.z

    };

  }).sort((a,b)=>a.depth - b.depth);

  for(const p of rendered){

    const glow = ctx.createRadialGradient(
      p.sx,
      p.sy,
      0,
      p.sx,
      p.sy,
      p.radius * 4
    );

    glow.addColorStop(0, p.color);
    glow.addColorStop(1, "transparent");

    ctx.beginPath();
    ctx.fillStyle = glow;
    ctx.globalAlpha = 0.16;
    ctx.arc(p.sx,p.sy,p.radius * 4,0,Math.PI * 2);
    ctx.fill();

    ctx.beginPath();
    ctx.fillStyle = p.color;
    ctx.globalAlpha = 0.82;
    ctx.arc(p.sx,p.sy,p.radius,0,Math.PI * 2);
    ctx.fill();

  }

  ctx.globalAlpha = 1;

  requestAnimationFrame(animate);

}

requestAnimationFrame(animate);

</script>

</body>
</html>
